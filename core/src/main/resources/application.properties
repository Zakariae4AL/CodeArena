spring.application.name=codearena-core
server.port=${PORT:8080}

# --- Database (PostgreSQL; schema managed by Flyway) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codearena}
spring.datasource.username=${DB_USERNAME:codearena}
spring.datasource.password=${DB_PASSWORD:codearena}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Redis (job queue to the judges) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false

# --- Spring Modulith: events are stored before listeners run (transactional outbox) ---
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.completion-mode=delete

# --- Security ---
# At least 32 bytes. The default only works outside the 'prod' profile.
codearena.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
codearena.jwt.ttl=${JWT_TTL:12h}
codearena.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
codearena.security.auth-requests-per-minute=${AUTH_RATE_LIMIT:10}

# --- Judge ---
codearena.judge.queue=${JUDGE_QUEUE:redis}
codearena.judge.jobs-stream=codearena:judge:jobs
codearena.judge.results-stream=codearena:judge:results
codearena.judge.group=core
codearena.judge.consumer-name=${JUDGE_CONSUMER_NAME:core-1}
codearena.judge.submissions-per-minute=${SUBMISSIONS_PER_MINUTE:10}

# --- Demo data (admin / alice, password codearena1) ---
codearena.seed.demo=${SEED_DEMO:true}

# --- Ops ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.error.include-stacktrace=never
server.shutdown=graceful
