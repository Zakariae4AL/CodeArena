spring.datasource.url=jdbc:h2:mem:codearena;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
codearena.judge.queue=memory
codearena.seed.demo=false
codearena.jwt.secret=test-secret-that-is-long-enough-for-hmac-sha256-1234
codearena.security.auth-requests-per-minute=100000
codearena.judge.submissions-per-minute=100000
codearena.outbox.retry-every=PT1H
spring.modulith.events.republish-outstanding-events-on-restart=false
management.health.redis.enabled=false
logging.level.dev.codearena=WARN
