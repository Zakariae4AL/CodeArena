# The whole stack:  docker compose --profile runners build && docker compose up --build
# Then open http://localhost:8088  (admin / codearena1, alice / codearena1)
name: codearena

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: codearena
      POSTGRES_USER: codearena
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codearena}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codearena -d codearena"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-codearena-redis}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-codearena-redis}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-codearena-redis}

  core:
    build: ./core
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/codearena
      DB_USERNAME: codearena
      DB_PASSWORD: ${DB_PASSWORD:-codearena}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-codearena-redis}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      CORS_ORIGINS: http://localhost:8088
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  judge:
    build:
      context: ./judge
      target: worker
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-codearena-redis}
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-2}
      # Optional stronger isolation if gVisor is installed on the host:
      # JUDGE_DOCKER_RUNTIME: runsc
    volumes:
      # The judge starts sandbox containers on the host's Docker engine.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8088:80"
    depends_on:
      - core

  # Sandbox images, built once with:  docker compose --profile runners build
  runner-cpp:
    profiles: ["runners"]
    image: codearena/runner-cpp
    build: { context: ./judge, target: runner-cpp }
  runner-java:
    profiles: ["runners"]
    image: codearena/runner-java
    build: { context: ./judge, target: runner-java }
  runner-python:
    profiles: ["runners"]
    image: codearena/runner-python
    build: { context: ./judge, target: runner-python }
  runner-javascript:
    profiles: ["runners"]
    image: codearena/runner-javascript
    build: { context: ./judge, target: runner-javascript }

volumes:
  pgdata:
  redisdata:
